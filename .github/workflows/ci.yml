name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22+ is required: the test suite is authored in .mts and run with the
          # native node test runner (glob + type-stripping), neither of which
          # Node 20 supports. 20 is also EOL on GitHub-hosted runners.
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_API_BASE: https://api.7sabek.ma
      - run: npm audit --omit=dev --audit-level=high
